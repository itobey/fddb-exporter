spring:
  application:
    name: fddb-exporter
  cloud:
    discovery:
      client:
        composite-indicator:
          enabled: false
  mongodb:
    database: fddb
    password: mongodb_fddb_password
    username: mongodb_fddb_user
    port: 27017
    host: localhost
  ai:
    mcp:
      server:
        enabled: ${fddb-exporter.mcp.enabled:false}
        name: fddb-exporter
        # streamable HTTP on /mcp, not the deprecated SSE transport Spring AI still defaults to
        protocol: STREAMABLE
        instructions: >
          Access to the user's own FDDB nutrition diary: one entry per day with the totals for
          calories, fat, carbs, sugar, protein and fibre, plus the list of products logged that day.
          Dates are always ISO YYYY-MM-DD; calories are kcal and all other nutrients are grams.
          Call get_server_info once to learn today's date and which period the data covers, and
          get_data_schema once before interpreting numbers. Prefer the aggregating tools over pulling
          raw days when a question is about averages or trends. Unlogged days are left out of every
          aggregation rather than counted as zero, so check list_missing_days before drawing
          conclusions from a long range. Everything here reads stored data. If export tools are
          present as well, they fetch fresh data from fddb.info, take about a second per day and put
          load on a third-party site under the user's own account - use them only when the user
          explicitly asks for fresh data, never to answer a question about data that is already
          stored, and never several at once.

vaadin:
  launch-browser: false
  allowed-packages:
    - com.vaadin
    - dev.itobey.adapter.api.fddb.exporter.ui

springdoc:
  api-docs:
    enabled: true
    path: /api-docs
  swagger-ui:
    enabled: true
    path: /swagger-ui.html
    groups-order: desc
    tags-sorter: alpha
    operations-sorter: alpha
    display-request-duration: true
    try-it-out-enabled: true
  show-actuator: false

management:
  endpoints:
    web:
      exposure:
        include: health, scheduledtasks
  endpoint:
    health:
      probes:
        enabled: true
      show-details: always
      group:
        liveness:
          include:
            - fddb-login-check
            - livenessState
        readiness:
          include:
            - readinessState
          exclude:
            - fddb-login-check
  health:
    defaults:
      enabled: true
    diskSpace:
      enabled: false
    mongodb:
      enabled: false

fddb-exporter:
  ui:
    fddb-link-prefix: https://fddb.info
  fddb:
    url: https://fddb.info
    username: ---
    password: ---
    min-days-back: 1
    max-days-back: 365
  scheduler:
    enabled: true
    cron: "0 0 3 * * *"
  telemetry:
    url: https://telemetry.itobey.dev
    username: fddb-exporter
    token: geXXjmYGbxfCxe3EX8onXH7yyg8ywxy9 #hard coded to prevent bots from accessing public endpoint
    cron: "0 0 4 * * *"
  persistence:
    mongodb:
      enabled: true
    influxdb:
      enabled: false
  influxdb:
    url: http://localhost:8086
    token: ---
    org: primary
    bucket: fddb-exporter
  notification:
    enabled: true
    telegram:
      token: ---
      chatId: ---
  mcp:
    enabled: false
    # the export tools scrape fddb.info and write to the database - read-only unless asked for
    write-tools-enabled: false

logging:
  level:
    root: INFO