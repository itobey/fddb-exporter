<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="theme-color" content="#4e619b">
    <title>Offline · FDDB Exporter</title>
    <style>
        /* This page is served as a static file, outside the Vaadin bundle, so it cannot read the
           theme's custom properties from styles.css. The tokens below are therefore duplicated
           rather than referenced - the values must be kept in step with the theme by hand. Only
           the handful this page actually uses are copied.

           Everything here is self-contained on purpose: no webfont, no logo file, no external
           request of any kind. This is the page that renders when the instance is unreachable,
           so any asset it depends on is an asset that may not load. */
        :root {
            --canvas-head: #3f4e7d;
            --canvas-mid-1: #414c73;
            --canvas-mid-2: #424a69;
            --canvas-mid-3: #43485f;
            --canvas-foot: #434655;

            --signal-gold: #ae9357;
            --signal-gold-hover: #bfa979;
            --signal-gold-active: #a98e52;
            --button-ink: #241f12;
            --focus-ring: #e6d6ab;

            --text-heading: rgba(255, 255, 255, 0.95);
            --text-body: rgba(255, 255, 255, 0.87);
            --text-secondary: rgba(255, 255, 255, 0.75);

            --radius-m: 6px;
            --shadow-seat: 0 1px 2px rgba(0, 0, 0, 0.3);
            --shadow-raise: 0 1px 3px rgba(0, 0, 0, 0.35), 0 1px 2px rgba(0, 0, 0, 0.2);
            --transition-fast: 150ms cubic-bezier(0.4, 0, 0.2, 1);
        }

        * {
            box-sizing: border-box;
        }

        html {
            color-scheme: dark;
        }

        body {
            margin: 0;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: max(1.5rem, env(safe-area-inset-top, 0))
                     max(1.5rem, env(safe-area-inset-right, 0))
                     max(1.5rem, env(safe-area-inset-bottom, 0))
                     max(1.5rem, env(safe-area-inset-left, 0));
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Roboto', 'Helvetica', 'Arial', sans-serif;
            font-weight: 400;
            line-height: 1.5;
            color: var(--text-body);
            /* The app's canvas, five stops, identical to body in styles.css - the offline page is
               the same room with nothing in it, not a different product. */
            background-image: linear-gradient(to bottom,
                var(--canvas-head), var(--canvas-mid-1), var(--canvas-mid-2),
                var(--canvas-mid-3), var(--canvas-foot));
            background-attachment: fixed;
        }

        .offline {
            max-width: 32rem;
            text-align: center;
        }

        /* A page of the record with one rule broken. Drawn rather than set as an emoji, in one
           stroke weight, so it belongs to the same hand as the rest of the app. */
        .offline__mark {
            display: block;
            width: 64px;
            height: 64px;
            margin: 0 auto 1.75rem;
            color: var(--text-secondary);
        }

        /* The theme's Headline step exactly - 1.5rem at 600, line-height 1.3. Flat rather than
           fluid: a fluid floor would have introduced a size that is not on the documented ramp,
           and this heading is short enough to simply wrap on a narrow screen. */
        .offline__title {
            margin: 0 0 0.75rem;
            font-size: 1.5rem;
            font-weight: 600;
            line-height: 1.3;
            text-wrap: balance;
            color: var(--text-heading);
        }

        .offline__body {
            margin: 0 0 2rem;
            color: var(--text-secondary);
        }

        .offline__retry {
            appearance: none;
            min-height: 44px;
            padding: 0.75rem 1.5rem;
            border: none;
            border-radius: var(--radius-m);
            background: var(--signal-gold);
            /* Dark ink, not white: white on this fill measures 2.95:1. Same reasoning, and the
               same pair of values, as the primary button in the theme. */
            color: var(--button-ink);
            font: inherit;
            font-weight: 500;
            cursor: pointer;
            box-shadow: var(--shadow-seat);
            transition: background-color var(--transition-fast),
                        transform var(--transition-fast),
                        box-shadow var(--transition-fast);
        }

        .offline__retry:hover {
            background: var(--signal-gold-hover);
            transform: translateY(-1px);
            box-shadow: var(--shadow-raise);
        }

        .offline__retry:active {
            background: var(--signal-gold-active);
            transform: translateY(0);
            box-shadow: none;
        }

        .offline__retry:focus-visible {
            outline: 2px solid var(--focus-ring);
            outline-offset: 2px;
        }

        /* The lift is the feedback, so it is cancelled outright rather than shortened. */
        @media (prefers-reduced-motion: reduce) {
            .offline__retry,
            .offline__retry:hover,
            .offline__retry:active {
                transform: none;
                transition-duration: 0.01ms;
            }
        }
    </style>
</head>
<body>
<main class="offline">
    <svg class="offline__mark" viewBox="0 0 48 48" fill="none" aria-hidden="true" focusable="false">
        <rect x="11" y="5" width="26" height="38" rx="3"
              stroke="currentColor" stroke-width="2" opacity="0.4"/>
        <g stroke="currentColor" stroke-width="2" stroke-linecap="round">
            <path d="M17 16h14" opacity="0.45"/>
            <path d="M17 24h4.5"/>
            <path d="M26.5 24H31"/>
            <path d="M17 32h14" opacity="0.45"/>
        </g>
    </svg>

    <h1 class="offline__title">Can't reach FDDB Exporter</h1>
    <p class="offline__body">
        The server isn't responding. It may be stopped, restarting, or unreachable from this network.
    </p>
    <button type="button" class="offline__retry">Try again</button>
</main>

<script>
    document.querySelector('.offline__retry')
        .addEventListener('click', function () {
            window.location.reload();
        });
</script>
</body>
</html>
